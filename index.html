<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thiện Ý</title>
  <meta name="description" content="Trang chủ Thiện Ý">
  <style>
    :root {
      --bg: #faf8f5;
      --text: #2b2b2b;
      --muted: #6b6b6b;
      --accent: #a0522d;
      --card: #ffffff;
      --border: #e8e2da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1918;
        --text: #ece8e3;
        --muted: #a39e98;
        --accent: #e0956a;
        --card: #242220;
        --border: #3a3633;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header, main, footer {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px;
    }
    header { padding-top: 64px; padding-bottom: 32px; text-align: center; }
    h1 { font-size: 2.5rem; color: var(--accent); letter-spacing: 0.02em; }
    .tagline { color: var(--muted); margin-top: 8px; }
    main { flex: 1; }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    h2 { font-size: 1.25rem; margin-bottom: 8px; }
    a { color: var(--accent); }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
      padding-top: 32px;
      padding-bottom: 32px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Thiện Ý</h1>
    <p class="tagline">Chào mừng bạn đến với trang của chúng tôi</p>
  </header>

  <main>
    <section>
      <h2>Giới thiệu</h2>
      <p>Đây là trang web đơn giản được host trên GitHub Pages. Bạn có thể chỉnh sửa nội dung trong file <code>index.html</code>.</p>
    </section>

    <section>
      <h2>Liên hệ</h2>
      <p>Xem mã nguồn tại <a href="https://github.com/haison8x/thien-y">github.com/haison8x/thien-y</a>.</p>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year">2026</span> Thiện Ý</p>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
